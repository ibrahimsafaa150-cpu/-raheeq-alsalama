<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>صيدلية رَحِيْقُ السَّلَامَة | النظام الدوائي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            overflow-x: hidden;
            background-color: #060913;
            color: #f8fafc;
            margin: 0;
            padding: 0;
        }

        .glass-panel {
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.95) 0%, rgba(10, 15, 29, 0.98) 100%);
            border: 1px solid rgba(6, 182, 212, 0.18);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }

        .logo-box {
            width: 44px;
            height: 44px;
            min-width: 44px;
            min-height: 44px;
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .modal-active { display: flex !important; }
    </style>
</head>
<body class="flex flex-col min-h-screen relative w-full">

    <!-- شريط الإعلان العلوي -->
    <div class="w-full bg-slate-900 border-b border-amber-500/20 text-[10px] py-1 px-3 text-center text-amber-300 flex justify-center items-center gap-1.5">
        <span>🌿</span>
        <span class="font-bold">صحتكم أمانتنا • جودة ورعاية</span>
    </div>

    <!-- الترويسة الرئيسية -->
    <header class="sticky top-0 z-40 bg-[#090d1a]/95 backdrop-blur-md border-b border-slate-800 shadow-md px-3 py-2.5 w-full">
        <div class="flex items-center justify-between gap-2 w-full">
            
            <div class="flex items-center gap-2 cursor-pointer min-w-0" onclick="resetView()">
                <div class="logo-box rounded-xl bg-slate-950 p-1 border border-amber-500/40 shadow flex items-center justify-center shrink-0">
                    <svg viewBox="0 0 100 100" class="w-full h-full">
                        <path d="M50 8 C30 10 20 30 22 45 C35 25 45 15 50 8 Z" fill="#84cc16"/>
                        <path d="M50 8 C70 10 80 30 78 45 C65 25 55 15 50 8 Z" fill="#84cc16"/>
                        <path d="M50 14 C47 22 43 27 50 34 C57 27 53 22 50 14 Z" fill="#f59e0b"/>
                        <path d="M18 55 C16 75 35 90 50 95 C30 85 24 70 26 55 C23 58 20 56 18 55 Z" fill="#0891b2"/>
                        <path d="M82 55 C84 75 65 90 50 95 C70 85 76 70 74 55 C77 58 80 56 82 55 Z" fill="#0d9488"/>
                        <circle cx="50" cy="38" r="4" fill="#38bdf8"/>
                        <path d="M50 42 L50 85" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
                        <path d="M38 46 C45 42 55 42 62 46 C55 50 45 50 38 46 Z" fill="#38bdf8"/>
                        <path d="M42 56 Q58 56 50 64 Q42 72 58 72" fill="none" stroke="#22d3ee" stroke-width="3" stroke-linecap="round"/>
                    </svg>
                </div>
                <div class="flex flex-col min-w-0">
                    <h1 class="text-xs sm:text-sm font-black text-transparent bg-clip-text bg-gradient-to-r from-amber-400 via-teal-300 to-cyan-400 truncate">
                        صيدلية رَحِيْقُ السَّلَامَة
                    </h1>
                    <span class="text-[8px] text-slate-400 font-bold tracking-tight uppercase truncate">RAHEEQ AL-SALAMA</span>
                </div>
            </div>

            <div class="flex items-center gap-1.5 shrink-0">
                <button onclick="openCartModal()" class="relative w-9 h-9 rounded-xl bg-slate-900 border border-slate-700 flex items-center justify-center active:scale-95" title="السلة">
                    <span class="text-sm">🛒</span>
                    <span id="cartBadge" class="absolute -top-1.5 -right-1.5 bg-gradient-to-r from-amber-500 to-teal-500 text-slate-950 text-[9px] font-black w-4 h-4 rounded-full flex items-center justify-center shadow">0</span>
                </button>

                <div id="adminActionHeader" class="hidden">
                    <button onclick="openAddModal()" class="bg-gradient-to-r from-teal-600 to-cyan-600 text-white font-bold text-[10px] px-2.5 py-2 rounded-xl transition flex items-center gap-1 shadow active:scale-95">
                        <span>➕</span> <span>إضافة</span>
                    </button>
                </div>
            </div>
        </div>

        <div class="mt-2 relative w-full">
            <input type="text" id="headerSearch" oninput="handleSearch(this.value)" placeholder="ابحث باسم الدواء، المادة الفعالة، الجرعة..." 
                   class="w-full bg-slate-950 text-white placeholder-slate-500 text-xs rounded-xl px-3 py-2 pr-9 border border-slate-800 focus:outline-none focus:border-cyan-400">
            <span class="absolute right-3 top-2 text-slate-500 text-xs">🔍</span>
        </div>
    </header>

    <nav class="bg-slate-950/80 border-b border-slate-800/80 py-2 px-2">
        <div class="flex gap-1.5 overflow-x-auto no-scrollbar w-full" id="circleCategories"></div>
    </nav>

    <main class="flex-grow w-full px-3 py-3 space-y-3 max-w-xl mx-auto">
        <div class="flex items-center justify-between px-1">
            <h3 id="currentSectionTitle" class="text-xs font-black text-white flex items-center gap-1.5">
                <span class="text-amber-400">●</span> كشف الأدوية والمستحضرات المعتمدة
            </h3>
            <select id="sortSelect" onchange="sortProducts(this.value)" class="bg-slate-900 border border-slate-800 text-slate-300 text-[10px] rounded-lg px-2 py-1 focus:outline-none">
                <option value="default">الترتيب الافتراضي</option>
                <option value="price-low">الأقل سعراً</option>
                <option value="price-high">الأعلى سعراً</option>
                <option value="stock-high">الكمية بالمخزن</option>
            </select>
        </div>

        <div id="productsGrid" class="space-y-2.5 w-full"></div>

        <div id="noResults" class="hidden text-center py-12 text-slate-400 glass-panel rounded-2xl">
            <div class="text-3xl mb-2">🔍</div>
            <h4 class="text-xs font-bold text-white">لم يتم العثور على الصنف المطلوب</h4>
        </div>
    </main>

    <!-- نافذة المشرف مع ميزة الرفع المباشر من الجهاز -->
    <div id="adminModal" class="fixed inset-0 bg-slate-950/90 backdrop-blur-md z-50 hidden items-center justify-center p-3">
        <div class="glass-panel rounded-2xl p-4 w-full max-w-md shadow-2xl relative max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-3 border-b border-slate-800 pb-2">
                <h3 id="adminModalTitle" class="text-xs font-black text-white flex items-center gap-1"><span>🛡️</span> إدارة الصنف الدوائي</h3>
                <button onclick="closeAdminModal()" class="text-slate-400 hover:text-white font-bold p-1">✕</button>
            </div>
            
            <form id="productForm" onsubmit="saveProduct(event)" class="space-y-2.5">
                <input type="hidden" id="editIndex">
                <div>
                    <label class="block text-[10px] font-semibold text-slate-300 mb-0.5">القسم الصيدلاني:</label>
                    <select id="prodCategory" required class="w-full bg-slate-950 border border-slate-800 rounded-lg px-2.5 py-1.5 text-xs text-white focus:outline-none focus:border-cyan-400">
                        <option value="المضادات الحيوية">🛡️ المضادات الحيوية والالتهاب</option>
                        <option value="المسكنات وخافضات الحرارة">💊 المسكنات وخافضات الحرارة</option>
                        <option value="القلب وضغط الدم">❤️ القلب وضغط الدم</option>
                        <option value="الجهاز الهضمي والمعدة">🍃 الجهاز الهضمي والمعدة</option>
                        <option value="الفيتامينات والمكملات">🌿 الفيتامينات والمكملات</option>
                    </select>
                </div>

                <div>
                    <label class="block text-[10px] font-semibold text-slate-300 mb-0.5">اسم الدواء التجاري:</label>
                    <input type="text" id="prodName" required placeholder="Ciproker" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-2.5 py-1.5 text-xs text-white focus:outline-none focus:border-cyan-400">
                </div>

                <div>
                    <label class="block text-[10px] font-semibold text-slate-300 mb-0.5">المادة الفعالة المحتواة:</label>
                    <input type="text" id="prodActive" required placeholder="Ciprofloxacin" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-2.5 py-1.5 text-xs text-white focus:outline-none focus:border-cyan-400">
                </div>

                <div class="grid grid-cols-3 gap-2">
                    <div>
                        <label class="block text-[10px] font-semibold text-slate-300 mb-0.5">الجرعة:</label>
                        <input type="text" id="prodDose" required placeholder="500 mg" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-2 py-1.5 text-xs text-white focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-[10px] font-semibold text-slate-300 mb-0.5">السعر (د.ع):</label>
                        <input type="text" id="prodPrice" required placeholder="5000" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-2 py-1.5 text-xs text-white focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-[10px] font-semibold text-slate-300 mb-0.5">الكمية بالمخزن:</label>
                        <input type="number" id="prodStock" required placeholder="50" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-2 py-1.5 text-xs text-white focus:outline-none">
                    </div>
                </div>

                <!-- اختيار الصورة مباشرة من الجهاز أو الرابط -->
                <div class="bg-slate-950/80 p-2.5 rounded-xl border border-slate-800 space-y-2">
                    <label class="block text-[10px] font-bold text-amber-400">صورة الدواء:</label>
                    
                    <div>
                        <label class="block text-[9px] text-slate-400 mb-1">1. اختيار صورة مباشرة من هاتفك (الأسهل والأضمن):</label>
                        <input type="file" id="prodFileInput" accept="image/*" onchange="handleImageUpload(event)" class="w-full text-[10px] text-slate-400 file:mr-2 file:py-1 file:px-2 file:rounded-lg file:border-0 file:text-[10px] file:font-semibold file:bg-cyan-950 file:text-cyan-300 hover:file:bg-cyan-900 cursor-pointer">
                    </div>

                    <div>
                        <label class="block text-[9px] text-slate-400 mb-0.5">2. أو رابط الصورة المباشر:</label>
                        <input type="text" id="prodImage" placeholder="https://... أو يتم ملؤه تلقائياً عند اختيار صورة" class="w-full bg-slate-900 border border-slate-800 rounded-lg px-2 py-1 text-[11px] text-white focus:outline-none">
                    </div>
                </div>

                <div class="flex justify-end gap-2 pt-2 border-t border-slate-800">
                    <button type="button" onclick="closeAdminModal()" class="bg-slate-800 text-slate-300 px-3 py-1.5 rounded-lg text-xs">إلغاء</button>
                    <button type="submit" class="bg-gradient-to-r from-teal-600 to-cyan-600 text-white px-4 py-1.5 rounded-lg text-xs font-bold shadow">حفظ الصنف</button>
                </div>
            </form>
        </div>
    </div>

    <!-- نافذة السلة -->
    <div id="cartModal" class="fixed inset-0 bg-slate-950/90 backdrop-blur-md z-50 hidden items-center justify-center p-3">
        <div class="glass-panel rounded-2xl p-4 w-full max-w-md shadow-2xl relative max-h-[85vh] flex flex-col">
            <div class="flex justify-between items-center mb-2 border-b border-slate-800 pb-2">
                <h3 class="text-xs font-black text-white flex items-center gap-1"><span>🛒</span> كشف الطلبيات</h3>
                <button onclick="closeCartModal()" class="text-slate-400 hover:text-white font-bold p-1">✕</button>
            </div>

            <div id="cartItemsList" class="overflow-y-auto space-y-2 flex-grow my-2 pr-0.5 no-scrollbar"></div>

            <div class="border-t border-slate-800 pt-2.5 space-y-2">
                <div class="flex justify-between items-center text-xs font-bold text-white">
                    <span>المجموع:</span>
                    <span id="cartTotalPrice" class="text-amber-400 font-black text-sm">0 د.ع</span>
                </div>
                <button onclick="checkoutOrder()" class="w-full bg-gradient-to-r from-amber-500 via-teal-600 to-cyan-600 text-slate-950 font-black py-2.5 rounded-xl text-xs shadow-md active:scale-95">
                    تأكيد وصرف الطلبية 🚀
                </button>
            </div>
        </div>
    </div>

    <footer class="bg-slate-950 border-t border-slate-900 text-center py-4 text-[10px] text-slate-500 mt-auto">
        <p class="font-bold text-slate-400">صيدلية رَحِيْقُ السَّلَامَة • صحتكُم أمانتُنا</p>
        <button onclick="toggleAdminMode()" id="adminFooterBtn" class="mt-1 text-slate-500 hover:text-cyan-400 underline block mx-auto">
            🔒 لوحة المشرف الصيدلاني
        </button>
    </footer>

    <script>
        let isAdmin = localStorage.getItem('sidalihet_admin') === 'true';

        const categories = [
            { name: "الكل", icon: "🌟" },
            { name: "المضادات الحيوية", icon: "🛡️" },
            { name: "المسكنات وخافضات الحرارة", icon: "💊" },
            { name: "القلب وضغط الدم", icon: "❤️" },
            { name: "الجهاز الهضمي والمعدة", icon: "🍃" },
            { name: "الفيتامينات والمكملات", icon: "🌿" }
        ];

        const defaultProducts = [
            {
                id: 1,
                name: "Augmentin",
                activeIngredient: "Amoxicillin + Clavulanic acid",
                dose: "1000 mg",
                category: "المضادات الحيوية",
                price: "14,000 د.ع",
                stock: 35,
                image: "https://images.unsplash.com/photo-1584308666744-24d5c474f2ae?auto=format&fit=crop&w=500&q=80"
            },
            {
                id: 2,
                name: "Ciprodar",
                activeIngredient: "Ciprofloxacin",
                dose: "500 mg",
                category: "المضادات الحيوية",
                price: "11,500 د.ع",
                stock: 18,
                image: "https://images.unsplash.com/photo-1471864190281-a93a3070b6de?auto=format&fit=crop&w=500&q=80"
            },
            {
                id: 3,
                name: "Panadol Extra",
                activeIngredient: "Paracetamol + Caffeine",
                dose: "500 mg / 65 mg",
                category: "المسكنات وخافضات الحرارة",
                price: "4,000 د.ع",
                stock: 75,
                image: "https://images.unsplash.com/photo-1584017911766-d451b3d0e843?auto=format&fit=crop&w=500&q=80"
            },
            {
                id: 4,
                name: "Concor",
                activeIngredient: "Bisoprolol Fumarate",
                dose: "5 mg",
                category: "القلب وضغط الدم",
                price: "9,000 د.ع",
                stock: 12,
                image: "https://images.unsplash.com/photo-1550572017-edd951b55104?auto=format&fit=crop&w=500&q=80"
            },
            {
                id: 5,
                name: "Losec",
                activeIngredient: "Omeprazole",
                dose: "20 mg",
                category: "الجهاز الهضمي والمعدة",
                price: "6,000 د.ع",
                stock: 40,
                image: "https://images.unsplash.com/photo-1576602976047-174e57a47881?auto=format&fit=crop&w=500&q=80"
            }
        ];

        let productsData = [];
        let cart = [];
        let currentFilter = 'الكل';

        try {
            const savedProducts = localStorage.getItem('sidalihet_upload_v2');
            productsData = savedProducts ? JSON.parse(savedProducts) : defaultProducts;
        } catch(e) {
            productsData = defaultProducts;
        }

        try {
            const savedCart = localStorage.getItem('sidalihet_upload_cart_v2');
            cart = savedCart ? JSON.parse(savedCart) : [];
        } catch(e) {
            cart = [];
        }

        function saveProductsToStorage() {
            localStorage.setItem('sidalihet_upload_v2', JSON.stringify(productsData));
        }

        function saveCartToStorage() {
            localStorage.setItem('sidalihet_upload_cart_v2', JSON.stringify(cart));
            updateCartBadge();
        }

        // قراءة الصورة وتحويلها فوراً من جهازك بدون روابط خارجية
        function handleImageUpload(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('prodImage').value = e.target.result;
                };
                reader.readAsDataURL(file);
            }
        }

        function renderCircleCategories() {
            const container = document.getElementById('circleCategories');
            let html = '';

            categories.forEach(cat => {
                const isActive = currentFilter === cat.name;
                html += `
                    <button onclick="filterByCategory('${cat.name}')" 
                            class="px-2.5 py-1.5 rounded-xl flex items-center gap-1 transition shrink-0 text-[11px] font-bold border ${
                                isActive 
                                ? 'bg-amber-500/20 border-amber-400 text-amber-300 shadow' 
                                : 'bg-slate-900/90 border-slate-800 text-slate-400 hover:text-white'
                            }">
                        <span>${cat.icon}</span>
                        <span>${cat.name}</span>
                    </button>
                `;
            });

            container.innerHTML = html;
        }

        function renderProducts(list = productsData) {
            const grid = document.getElementById('productsGrid');
            const noResults = document.getElementById('noResults');
            grid.innerHTML = '';

            if (list.length === 0) {
                noResults.classList.remove('hidden');
                return;
            } else {
                noResults.classList.add('hidden');
            }

            list.forEach((prod) => {
                const isLow = prod.stock <= 5;
                grid.innerHTML += `
                    <div class="glass-panel rounded-2xl p-3 w-full flex flex-col gap-2.5">
                        <div class="flex gap-2.5 items-start">
                            
                            <div class="w-20 h-20 rounded-xl bg-slate-950 border border-slate-800 p-1 shrink-0 flex items-center justify-center relative overflow-hidden">
                                <img src="${prod.image}" alt="${prod.name}" class="object-contain w-full h-full">
                                <span class="absolute bottom-0.5 right-0.5 ${isLow ? 'bg-rose-500/90' : 'bg-emerald-600/90'} text-white text-[8px] font-black px-1 rounded shadow">
                                    المخزن: ${prod.stock}
                                </span>
                            </div>

                            <div class="flex-1 min-w-0 space-y-1">
                                <div class="flex items-center justify-between gap-1">
                                    <h4 class="text-xs sm:text-sm font-black text-white truncate">${prod.name}</h4>
                                    <span class="bg-cyan-950 text-cyan-300 border border-cyan-800 text-[9px] font-black px-1.5 py-0.5 rounded shrink-0">
                                        ${prod.dose}
                                    </span>
                                </div>

                                <div class="bg-slate-950/70 p-1.5 rounded-lg border border-slate-800/80">
                                    <span class="text-[8px] text-amber-400 font-bold block leading-none mb-0.5">المادة الفعالة:</span>
                                    <span class="text-[10px] text-slate-200 font-semibold truncate block">${prod.activeIngredient}</span>
                                </div>

                                <div class="flex items-center justify-between pt-0.5">
                                    <span class="text-[9px] text-slate-400 truncate">${prod.category}</span>
                                    <span class="text-xs font-black text-amber-400">${prod.price}</span>
                                </div>
                            </div>

                        </div>

                        <div class="flex items-center gap-1.5 pt-1.5 border-t border-slate-800/70">
                            <button onclick="addToCart(${prod.id})" class="flex-1 bg-gradient-to-r from-teal-600 to-cyan-600 hover:opacity-95 text-white font-bold py-1.5 rounded-lg text-xs transition flex items-center justify-center gap-1 shadow active:scale-95">
                                <span>🛒</span> <span>إضافة للطلبية</span>
                            </button>
                            ${isAdmin ? `
                            <button onclick="openEditModal(${prod.id})" class="bg-slate-800 text-slate-200 px-2 py-1.5 rounded-lg text-xs border border-slate-700 active:scale-95" title="تعديل">✏️</button>
                            <button onclick="deleteProduct(${prod.id})" class="bg-rose-950/60 text-rose-400 px-2 py-1.5 rounded-lg text-xs border border-rose-900 active:scale-95" title="حذف">🗑️</button>
                            ` : ''}
                        </div>
                    </div>
                `;
            });
        }

        function filterByCategory(cat) {
            currentFilter = cat;
            document.getElementById('currentSectionTitle').innerHTML = cat === 'الكل' ? '<span class="text-amber-400">●</span> كشف الأدوية والمستحضرات المعتمدة' : `<span class="text-teal-400">●</span> قسم: ${cat}`;
            renderCircleCategories();

            if (cat === 'الكل') {
                renderProducts(productsData);
            } else {
                const filtered = productsData.filter(p => p.category === cat);
                renderProducts(filtered);
            }
        }

        function handleSearch(query) {
            const q = query.trim().toLowerCase();
            if (!q) {
                filterByCategory(currentFilter);
                return;
            }
            const filtered = productsData.filter(p => 
                p.name.toLowerCase().includes(q) || 
                p.activeIngredient.toLowerCase().includes(q) || 
                p.dose.toLowerCase().includes(q) || 
                p.category.toLowerCase().includes(q)
            );
            renderProducts(filtered);
        }

        function resetView() {
            document.getElementById('headerSearch').value = '';
            filterByCategory('الكل');
        }

        function sortProducts(criteria) {
            let sorted = [...productsData];
            if (criteria === 'price-low') {
                sorted.sort((a, b) => parseFloat(a.price.replace(/[^0-9.]/g, '')) - parseFloat(b.price.replace(/[^0-9.]/g, '')));
            } else if (criteria === 'price-high') {
                sorted.sort((a, b) => parseFloat(b.price.replace(/[^0-9.]/g, '')) - parseFloat(a.price.replace(/[^0-9.]/g, '')));
            } else if (criteria === 'stock-high') {
                sorted.sort((a, b) => b.stock - a.stock);
            }
            renderProducts(sorted);
        }

        function addToCart(id) {
            const prod = productsData.find(p => p.id === id);
            if (!prod) return;

            if (prod.stock <= 0) {
                alert('⚠️ هذا الدواء غير متوفر في المخزن حالياً!');
                return;
            }

            const existing = cart.find(item => item.id === id);
            if (existing) {
                if (existing.qty >= prod.stock) {
                    alert('⚠️ لقد بلغت الحد الأقصى المتوفر في المخزن.');
                    return;
                }
                existing.qty += 1;
            } else {
                cart.push({ ...prod, qty: 1 });
            }
            saveCartToStorage();
            alert(`✅ تمت إضافة "${prod.name}" بنجاح!`);
        }

        function updateCartBadge() {
            const totalCount = cart.reduce((sum, item) => sum + item.qty, 0);
            document.getElementById('cartBadge').innerText = totalCount;
        }
        updateCartBadge();

        function openCartModal() {
            const list = document.getElementById('cartItemsList');
            const totalPriceEl = document.getElementById('cartTotalPrice');
            list.innerHTML = '';

            if (cart.length === 0) {
                list.innerHTML = `<div class="text-center py-6 text-slate-500 text-xs">سلة الأدوية فارغة حالياً.</div>`;
                totalPriceEl.innerText = '0 د.ع';
            } else {
                let total = 0;
                cart.forEach((item, index) => {
                    let itemPriceNum = parseFloat(item.price.replace(/[^0-9.]/g, '')) || 0;
                    let itemTotal = itemPriceNum * item.qty;
                    total += itemTotal;

                    list.innerHTML += `
                        <div class="flex items-center justify-between bg-slate-950 p-2 rounded-xl border border-slate-800">
                            <div class="flex items-center gap-2">
                                <img src="${item.image}" class="w-9 h-9 rounded-lg object-contain bg-slate-900 p-0.5 border border-slate-800">
                                <div>
                                    <h5 class="text-[11px] font-black text-white">${item.name} <span class="text-cyan-400 text-[9px]">(${item.dose})</span></h5>
                                    <span class="text-[10px] text-amber-400 font-bold">${item.price}</span>
                                </div>
                            </div>
                            <div class="flex items-center gap-1">
                                <button onclick="changeQty(${index}, -1)" class="w-6 h-6 rounded bg-slate-800 text-xs font-bold active:scale-90">-</button>
                                <span class="text-xs font-bold text-cyan-400 px-1">${item.qty}</span>
                                <button onclick="changeQty(${index}, 1)" class="w-6 h-6 rounded bg-slate-800 text-xs font-bold active:scale-90">+</button>
                                <button onclick="removeFromCart(${index})" class="text-rose-400 text-xs font-bold px-1">🗑️</button>
                            </div>
                        </div>
                    `;
                });
                totalPriceEl.innerText = total.toLocaleString() + ' د.ع';
            }

            const modal = document.getElementById('cartModal');
            modal.classList.remove('hidden');
            modal.classList.add('modal-active');
        }

        function closeCartModal() {
            const modal = document.getElementById('cartModal');
            modal.classList.remove('modal-active');
            modal.classList.add('hidden');
        }

        function changeQty(index, delta) {
            const item = cart[index];
            const originalProd = productsData.find(p => p.id === item.id);

            if (delta > 0 && originalProd && item.qty >= originalProd.stock) {
                alert('⚠️ لا توجد كمية كافية بالمخزن.');
                return;
            }

            item.qty += delta;
            if (item.qty <= 0) {
                cart.splice(index, 1);
            }
            saveCartToStorage();
            openCartModal();
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            saveCartToStorage();
            openCartModal();
        }

        function checkoutOrder() {
            if (cart.length === 0) {
                alert('السلة فارغة!');
                return;
            }

            cart.forEach(cItem => {
                const prod = productsData.find(p => p.id === cItem.id);
                if (prod) {
                    prod.stock = Math.max(0, prod.stock - cItem.qty);
                }
            });

            saveProductsToStorage();
            alert('🎉 تم صرف وتأكيد الطلبية وتحديث المخزن بنجاح!');
            cart = [];
            saveCartToStorage();
            closeCartModal();
            filterByCategory(currentFilter);
        }

        function updateAdminUI() {
            const headerBtn = document.getElementById('adminActionHeader');
            const footerBtn = document.getElementById('adminFooterBtn');

            if (isAdmin) {
                headerBtn.classList.remove('hidden');
                footerBtn.innerText = "🔓 تسجيل خروج المشرف";
                footerBtn.className = "mt-1 text-rose-400 hover:underline block mx-auto font-bold";
            } else {
                headerBtn.classList.add('hidden');
                footerBtn.innerText = "🔒 لوحة المشرف الصيدلاني";
                footerBtn.className = "mt-1 text-slate-500 hover:text-cyan-400 underline block mx-auto";
            }
            renderProducts();
        }

        function toggleAdminMode() {
            if (isAdmin) {
                if (confirm('هل تريد الخروج من وضع المشرف؟')) {
                    isAdmin = false;
                    localStorage.setItem('sidalihet_admin', 'false');
                    updateAdminUI();
                }
            } else {
                let pin = prompt('أدخل رمز المرور السري للمشرف:');
                if (pin === 'google@199920012005') {
                    isAdmin = true;
                    localStorage.setItem('sidalihet_admin', 'true');
                    updateAdminUI();
                    alert('تم الدخول كـ مشرف صيدلي بنجاح!');
                } else if (pin !== null) {
                    alert('رمز المرور غير صحيح!');
                }
            }
        }

        function openAddModal() {
            document.getElementById('adminModalTitle').innerHTML = '<span>🛡️</span> إضافة صنف دواء جديد';
            document.getElementById('editIndex').value = '';
            document.getElementById('prodCategory').value = 'المضادات الحيوية';
            document.getElementById('prodName').value = '';
            document.getElementById('prodActive').value = '';
            document.getElementById('prodDose').value = '';
            document.getElementById('prodPrice').value = '';
            document.getElementById('prodStock').value = '';
            document.getElementById('prodImage').value = '';
            document.getElementById('prodFileInput').value = '';

            const modal = document.getElementById('adminModal');
            modal.classList.remove('hidden');
            modal.classList.add('modal-active');
        }

        function openEditModal(id) {
            const prod = productsData.find(p => p.id === id);
            if (!prod) return;

            document.getElementById('adminModalTitle').innerHTML = '<span>✏️</span> تعديل بيانات الصنف الدوائي';
            document.getElementById('editIndex').value = prod.id;
            document.getElementById('prodCategory').value = prod.category;
            document.getElementById('prodName').value = prod.name;
            document.getElementById('prodActive').value = prod.activeIngredient;
            document.getElementById('prodDose').value = prod.dose;
            document.getElementById('prodPrice').value = prod.price.replace(/[^0-9]/g, '');
            document.getElementById('prodStock').value = prod.stock;
            document.getElementById('prodImage').value = prod.image;
            document.getElementById('prodFileInput').value = '';

            const modal = document.getElementById('adminModal');
            modal.classList.remove('hidden');
            modal.classList.add('modal-active');
        }

        function closeAdminModal() {
            const modal = document.getElementById('adminModal');
            modal.classList.remove('modal-active');
            modal.classList.add('hidden');
        }

        function saveProduct(event) {
            event.preventDefault();
            const editId = document.getElementById('editIndex').value;

            let rawPrice = document.getElementById('prodPrice').value.trim();
            let formattedPrice = rawPrice.includes('د.ع') ? rawPrice : Number(rawPrice.replace(/[^0-9]/g, '')).toLocaleString() + ' د.ع';

            const newProdData = {
                id: editId ? parseInt(editId) : Date.now(),
                category: document.getElementById('prodCategory').value,
                name: document.getElementById('prodName').value.trim(),
                activeIngredient: document.getElementById('prodActive').value.trim(),
                dose: document.getElementById('prodDose').value.trim(),
                price: formattedPrice,
                stock: parseInt(document.getElementById('prodStock').value) || 0,
                image: document.getElementById('prodImage').value.trim() || 'https://images.unsplash.com/photo-1584308666744-24d5c474f2ae?auto=format&fit=crop&w=500&q=80'
            };

            if (editId) {
                const index = productsData.findIndex(p => p.id === parseInt(editId));
                if (index !== -1) {
                    productsData[index] = newProdData;
                }
            } else {
                productsData.unshift(newProdData);
            }

            saveProductsToStorage();
            closeAdminModal();
            filterByCategory(currentFilter);
            alert('✅ تم حفظ الصنف الدوائي بنجاح!');
        }

        function deleteProduct(id) {
            if (confirm('هل أنت متأكد من حذف هذا الدواء نهائياً؟')) {
                productsData = productsData.filter(p => p.id !== id);
                saveProductsToStorage();
                filterByCategory(currentFilter);
            }
        }

        renderCircleCategories();
        renderProducts();
        updateAdminUI();
    </script>
</body>
</html>
